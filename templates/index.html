<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup — compose your channel list</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1>Lineup</h1>
  </div>
  <p class="tagline">Compose your list, one working channel at a time.</p>
</header>

<section class="panel sources-panel" aria-labelledby="sources-heading">
  <div class="panel-head">
    <h2 id="sources-heading">M3U Sources</h2>
    <div class="panel-settings">
      <div class="refresh-setting">
        <label for="refresh-value">Source refresh</label>
        <input type="number" id="refresh-value" min="0" step="1" inputmode="numeric">
        <select id="refresh-unit">
          <option value="60">min</option>
          <option value="3600">hours</option>
          <option value="86400">days</option>
        </select>
      </div>
      <div class="refresh-setting">
        <label for="check-interval-value">Channel check</label>
        <input type="number" id="check-interval-value" min="0" step="1" inputmode="numeric">
        <select id="check-interval-unit">
          <option value="60">min</option>
          <option value="3600">hours</option>
          <option value="86400">days</option>
        </select>
      </div>
      <div class="refresh-setting">
        <button type="button" id="save-refresh-btn" class="small ghost">Save</button>
        <span id="refresh-status" class="refresh-status"></span>
      </div>
    </div>
  </div>

  <form id="source-form" class="fetch-form">
    <input id="source-url" type="url" placeholder="M3U source URL (https://...)" required>
    <input id="source-label" type="text" placeholder="Name (optional)" class="source-label-input">
    <button type="submit">Add</button>
  </form>

  <ul id="sources-list" class="sources-list" role="list"></ul>
</section>

<main class="layout">

  <section class="panel" aria-labelledby="source-heading">
    <div class="panel-head">
      <h2 id="source-heading">Source channels</h2>
      <span id="source-count" class="count">0</span>
    </div>

    <div class="filters">
      <input id="search-input" type="search" placeholder="Search for a channel…">
      <select id="group-filter">
        <option value="">All groups</option>
      </select>
    </div>

    <ul id="channel-list" class="channel-list" role="list"></ul>
  </section>

  <section class="panel" aria-labelledby="lineup-heading">
    <div class="panel-head">
      <h2 id="lineup-heading">Your lineup</h2>
      <div class="lineup-actions">
        <button id="check-btn" class="small ghost">Check</button>
        <button id="export-btn" class="export-btn">Export .m3u</button>
      </div>
    </div>

    <ul id="virtual-list" class="virtual-list" role="list"></ul>
    <p id="virtual-empty" class="empty-state">
      No channels yet. Add one from the left column.
    </p>
  </section>

</main>

<div id="add-popover" class="popover" hidden>
  <div class="popover-inner">
    <h3>Add <span id="add-popover-name"></span></h3>
    <label class="popover-label">New channel</label>
    <div class="popover-row">
      <input id="new-channel-name" type="text" placeholder="Channel name">
      <button id="create-channel-btn">Create</button>
    </div>
    <label class="popover-label">Or add as fallback to</label>
    <select id="existing-channel-select">
      <option value="">— choose —</option>
    </select>
    <div class="popover-actions">
      <button id="add-to-existing-btn">Add</button>
      <button id="cancel-add-btn" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
